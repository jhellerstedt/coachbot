# Paths relative to this file's directory unless absolute.
cache_dir: ./erg_strava_cache

# Plan weeks and activity matching use this IANA timezone (Mon–Sun local).
plan_timezone: Australia/Melbourne

# Season master plan (erg_strava_cache/season_master_plan.md): macro targets for expert
# review and weekly plan input. Edit Tgt/phase/Tgt priority/notes in the markdown;
# use strava_erg_hr_plot.py --refresh-season-plan to LLM-regenerate macro targets.
season:
  # Optional; default = Monday of the current plan week when first generated
  # start_date: 2026-06-09
  races:
    - name: Victoria State Championships
      date: 2027-03-15
      description: club 4x− over 2 km — target crew time 6:40
    - name: Head of the Yarra
      date: 2026-11-30
      description: 8.5 km eights race — aerobic endurance and race pace
  # Fallback HR bounds when computing squad Actual columns without per-athlete max HR
  hr_zones:
    z2_max: 145
    z5_min: 175

# Strava auth: OAuth files in each athlete's token_dir (same as lighties/):
#   strava_token, optional strava_refresh_token, strava_token_expires,
#   optional .env with STRAVA_CLIENT_ID and STRAVA_CLIENT_SECRET.
# See lighties/STRAVA_SETUP.md and lighties/regenerate_strava_token.py.

athletes:
  # Prefer token_dir with OAuth for that athlete (token owner = id below).
  # If only one Strava account is configured, other athletes are skipped for API sync.
  - id: 12345678
    label: Athlete One
    token_dir: ../lighties
    # Personalised HR zone targets (used in athlete DMs and @coach replies).
    # Zone bpm ranges are computed from max_hr_bpm × the fractions below.
    body_weight_kg: 82
    max_hr_bpm: 185
    hr_zones:
      # 5-zone model (Z1–Z5); z2/z5 also used for season adherence fallbacks.
      z2: [0.60, 0.70]   # e.g. 111–130 bpm at 185 max HR
      z5: [0.90, 1.00]   # e.g. 167–185 bpm
      # Optional overrides for any Z1–Z5 band (fractions of max_hr_bpm):
      # z1: [0.50, 0.60]
      # z3: [0.70, 0.80]
      # z4: [0.80, 0.90]
      # 7-zone T-level model (T1–T7) for per-segment rowing session targets.
      # Omit to use defaults below.
      # t1: [0.50, 0.60]   # recovery → e.g. 93–111 bpm
      # t2: [0.60, 0.68]   # UT3 → e.g. 111–126 bpm
      # t3: [0.68, 0.75]   # UT2-low → e.g. 126–139 bpm
      # t4: [0.75, 0.82]   # UT2 / steady state → e.g. 139–152 bpm
      # t5: [0.82, 0.88]   # UT1 → e.g. 152–163 bpm
      # t6: [0.88, 0.94]   # AT / threshold → e.g. 163–174 bpm
      # t7: [0.94, 1.00]   # race pace / VO2max → e.g. 174–185 bpm
    # Map Zulip senders to this athlete for @coach erg score screenshots:
    zulip_email: athlete@example.com
    # zulip_full_name: Athlete One
    # zulip_user_id: 12345

  # - id: 87654321
  #   label: Athlete Two
  #   token_dir: ../path/to/other/tokens
  #   body_weight_kg: 70
  #   max_hr_bpm: 178
  #   hr_zones:
  #     z2: [0.62, 0.72]
  #     z5: [0.88, 1.00]

# Indoor rowing: VirtualRow, or Rowing with trainer=true (Strava flags).
# VirtualRow = indoor rowing. Rowing is included only when Strava marks trainer=true
# if require_trainer_for_rowing is true (default).
# erg_sport_types: [VirtualRow]
# require_trainer_for_rowing: true

# Gym / weight sessions — parsed into erg_strava_cache/athlete_*/metrics/
# (total tonnage, max weight per exercise, per-set loads).
#
# Suunto gym moves (activityId 23) store notes like:
#   **Bench Press:** 8r 40, 5r 50, 5r 50
#   **Kettlebell Swings:** 15r 10, 10, 10
# Weights are treated as kg. Suunto notes are preferred over Strava descriptions when
# linked via suuntool sync (see suunto.gym_activity_ids below).
gym:
  sport_types: [WeightTraining, Workout, Crossfit, HighIntensityIntervalTraining]
  # Regex patterns matched against activity name (case-insensitive)
  name_patterns:
    - "\\bgym\\b"
    - "\\bweight\\b"
    - "\\blifting\\b"
    - "\\bstrength\\b"
    - "\\bkettlebell\\b"

# Suunto direct sync (primary activity catalog via suuntool CLI; Strava is fallback).
# Requires: suuntool login (see https://github.com/tajchert/suuntool)
suunto:
  enabled: true
  primary: true
  # Limit API sync and KDE Suunto streams to athletes with a Suunto account.
  # Omit = all athletes (wrong when suuntool is a single login).
  athlete_ids: [53603359]
  # If this path is missing, coachbot tries ../bin/suuntool, ../../bin/suuntool, and PATH.
  # Mapped Suunto athletes get a Zulip DM on failure.
  # suuntool_path: ../bin/suuntool
  # session_file: ~/.config/suuntool/session.json
  indoor_rowing_activity_ids: [57]
  # Gym / weight training in Suunto app (matches moves like maps.suunto.com/.../Gym)
  gym_activity_ids: [23]
  list_since_days: 120

# Strava is optional when suunto.primary is true (linking, Concept2 photos, legacy cache).
strava:
  optional: true
  link_for_photos: true

# Suunto + Concept2 display photos (OCR splits, align to HR timeline)
concept2_photos:
  enabled: true
  device_substrings: [suunto]
  time_window_sec: 25      # fuzzy search around photo timestamp (seconds)
  split_tolerance_sec: 18 # max |stream-pace − OCR split| to accept refinement
  multi_stagger_sec: 4.0  # when one photo yields multiple splits, time offset between them
