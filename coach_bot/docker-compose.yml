services:
  coach-bot:
    build:
      context: ..
      dockerfile: coach_bot/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Match host user so erg_scores/cache files are writable by cron.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      CACHE_DIR: /data/cache
      CONFIG_PATH: /app/config.yaml
      ZULIPRC_PATH: /app/zuliprc
      ZULIP_STREAM: general
      # ZULIP_TOPIC unset = all topics in the stream; set to e.g. project-640 to restrict
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENROUTER_STRUCTURED_MODEL: ${OPENROUTER_STRUCTURED_MODEL:-openrouter/auto}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-openrouter/auto}
      OPENROUTER_COST_TIER: ${OPENROUTER_COST_TIER:-low}
    volumes:
      - ../erg_strava/erg_strava_cache:/data/cache
      - ../zuliprc:/app/zuliprc:ro
      - ../erg_strava/config.yaml:/app/config.yaml:ro
